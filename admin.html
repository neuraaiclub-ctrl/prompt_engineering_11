<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURA — Prompt Engineering Hackathon</title>
  <meta name="theme-color" content="#04050b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/neura-core.css?v=3">
  <link rel="stylesheet" href="./styles/neura-shell.css?v=3">
  <link rel="stylesheet" href="./styles/neura-components.css?v=3">
  <link rel="stylesheet" href="./styles/neura-gateway.css?v=3">
  <link rel="stylesheet" href="./styles/neura-arena.css?v=3">
</head>
<body data-page="admin-dashboard">
  <canvas id="wormhole" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>
  <header class="topnav">
    <div class="brand" id="brandLogo" title="Home" role="link" tabindex="0">
      <img src="./assets/neura-logo.jpg" alt="" class="brand-logo-img"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="brand-logo-fallback" aria-hidden="true">N</span>
      <div class="brand-text">
        <b>NEURA</b>
        <small>Prompt engineering hackathon</small>
      </div>
    </div>
    <nav class="navlinks" aria-label="Primary">
      <a href="arena.html" data-page="arena" data-role="participant" class="btn btn-ghost">Prompt arena</a>
      <a href="fix.html" data-page="r1" data-role="participant" class="btn btn-ghost">Fix the prompt</a>
      <a href="team.html" data-page="team" data-role="participant" class="btn btn-ghost">Team</a>
      <a href="judge.html" data-page="judge" data-role="judge" class="btn btn-ghost">Judging</a>
      <a href="admin.html" data-page="admin" data-role="admin" class="btn btn-ghost">Admin</a>
      <a href="live.html" data-page="live" data-role="spectator" class="btn btn-ghost">Live board</a>
    </nav>
    <div class="nav-right">
      <a href="login.html" class="btn btn-sm" id="btnNavSignIn" style="display:none; text-decoration:none;">Sign in</a>
      <div class="user-session-wrap" id="userSessionWrap" style="display:none;">
        <span class="session-role" id="navRoleBadge" data-role="participant">Participant</span>
        <span class="session-user-name" id="navUserName"></span>
        <button class="btn btn-sm btn-ghost" id="btnNavLogout" title="Sign out">Sign out</button>
      </div>
      <div class="timer-wrap" id="navTimerWrap">
        <div class="timer-ring">
          <svg width="44" height="44">
            <circle class="timer-track" cx="22" cy="22" r="18"></circle>
            <circle class="timer-prog" id="navTimerCircle" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"></circle>
          </svg>
          <div class="timer-num" id="navTimerNum">03:00</div>
        </div>
      </div>
    </div>
  </header>
  <main class="page-container">
    <section class="view-section active" id="page-admin-dashboard"></section>
  </main>
  <div class="neura-modal-overlay" id="modalStaffLogin" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="staffTitle">
    <div class="neura-modal" style="max-width:420px; width:100%; padding:28px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
        <h3 class="modal-title" id="staffTitle">Staff sign-in</h3>
        <button class="btn-modal-close" id="btnCloseStaffModal" aria-label="Close">&times;</button>
      </div>
      <p class="sub-text" style="margin-bottom:20px;">For directors and judges.</p>
      <div class="field">
        <label for="staffEmailInput">Email</label>
        <input type="email" id="staffEmailInput" placeholder="you@neura.io" autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label for="staffPasswordInput">Password</label>
        <input type="password" id="staffPasswordInput" autocomplete="current-password">
      </div>
      <button class="btn btn-violet" style="width:100%;" id="btnPerformStaffLogin">Sign in</button>
      <div id="staffLoginError" role="alert" style="color:#ff8a9b; font-size:13px; margin-top:12px; display:none;"></div>
    </div>
  </div>
  <div id="customModalContainer"></div>
  <script type="module" src="./js/app-admin.js"></script>
</body>
</html>
